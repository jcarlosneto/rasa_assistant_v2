# 🎓 NLU - NATURAL LANGUAGE UNDERSTANDING
# ========================================
# Este arquivo contém INTENTS e ENTITIES que o bot pode reconhecer.
#
# 📚 CONCEITOS:
# - Intent: O QUE o usuário quer fazer (intenção)
# - Entity: DETALHES específicos extraídos da mensagem
# - Examples: Exemplos de frases para treinar o modelo
#
# 🎯 Quanto mais exemplos variados, melhor o bot aprende!

version: "3.1"

nlu:
  # ==========================================
  # 👋 INTENTS DE SAUDAÇÃO
  # ==========================================

  - intent: greet
    examples: |
      - oi
      - olá
      - opa
      - e aí
      - fala
      - oi tudo bem
      - olá tudo bem?
      - oi bot
      - ei
      - hey
      - hello
      - hi
      - eae
      - salve
      - oi pessoal
      - olá pessoal

  - intent: greet_morning
    examples: |
      - bom dia
      - oi, bom dia
      - olá, bom dia
      - bomdia
      - opa, bom dia
      - bom dia!
      - bom dia, como vai?
      - bom dia bot
      - oi bom dia
      - olá bom dia

  - intent: greet_afternoon
    examples: |
      - boa tarde
      - oi, boa tarde
      - olá, boa tarde
      - boatarde
      - boa tarde!
      - e aí, boa tarde
      - fala, boa tarde

  - intent: greet_evening
    examples: |
      - boa noite
      - oi, boa noite
      - olá, boa noite
      - boanoite
      - boa noite!
      - e aí, boa noite
      - oi boa noite

  # ==========================================
  # 👋 DESPEDIDAS E CONTROLE
  # ==========================================

  - intent: goodbye
    examples: |
      - tchau
      - até logo
      - até mais
      - falou
      - vlw
      - até amanhã
      - até breve
      - até depois
      - xau
      - flw
      - até
      - tenho que ir
      - vou nessa
      - preciso ir
      - abraço
      - até mais tarde

  - intent: stop
    examples: |
      - pare
      - parar
      - cancelar
      - cancela
      - sair
      - stop
      - para
      - interromper
      - não quero mais
      - desistir
      - deixa pra lá
      - esquece

  # ==========================================
  # ✅ CONFIRMAÇÕES
  # ==========================================

  - intent: confirmar_sim
    examples: |
      - sim
      - s
      - claro
      - com certeza
      - isso mesmo
      - correto
      - exato
      - pode ser
      - ok
      - beleza
      - tá bom
      - perfeito
      - isso
      - afirmativo
      - positivo
      - pode crer
      - é isso aí

  - intent: confirmar_nao
    examples: |
      - não
      - n
      - nunca
      - de jeito nenhum
      - negativo
      - nem pensar
      - não quero
      - nada disso
      - errado
      - incorreto
      - nope
      - nop
      - jamais

