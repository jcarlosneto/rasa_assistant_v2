  # 🎓 NOTA PARA PROFESSORES:
  # - Adicionar mais exemplos melhora a precisão
  # - Variações de escrita (com/sem acentos, typos) ajudam
  # - Exemplos devem cobrir diferentes formas de dizer a mesma coisa

  # ==========================================
  # 🔤 REGEX PATTERNS (Padrões)
  # ==========================================
  # Regex patterns ajudam a reconhecer padrões específicos

  - regex: duracao
    examples: |
      - \d+\s*(min|minutos?|horas?)
      - \d+
      - (vinte|trinta|quarenta|cinquenta|sessenta)

  - regex: atividade_corrida
    examples: |
      - corr(i|er|ida|endo)
      - runn?(ing)?

  - regex: atividade_caminhada
    examples: |
      - caminh(ei|ar|ada|ando)
      - and(ei|ar|ando)
      - walk(ing)?

  - regex: atividade_exercicio
    examples: |
      - malh(ei|ar|ando)
      - exerc(ício|itei|itar)
      - treino?
      - academia

  - regex: atividade_natacao
    examples: |
      - nad(ei|ar|ando)
      - nata(ção|cao)
      - piscina
      - swim(ming)?

  - regex: atividade_meditacao
    examples: |
      - medit(ei|ar|ação|acao)
      - mindfulness

