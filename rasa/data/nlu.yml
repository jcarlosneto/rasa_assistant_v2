  # ==========================================
  # 📅 AGENDAR ATIVIDADE (novo na v2)
  # ==========================================
  # 🎓 NOTA DIDÁTICA:
  # Aqui o NLU só precisa descobrir a INTENÇÃO e o TIPO da atividade.
  # Data e hora ("amanhã às 7h") NÃO são anotadas como entidade: quem lê isso
  # é uma expressão regular em actions/catalogo.py. ML para entender,
  # regra para o que é previsível.

  - intent: agendar_atividade
    examples: |
      - agendar [corrida](tipo_atividade) amanhã às 7h
      - agendar [yoga](tipo_atividade) para sexta às 18h
      - marcar [natação](tipo_atividade) para amanhã
      - marcar [caminhada](tipo_atividade) hoje às 19h
      - quero agendar [musculação](tipo_atividade) para segunda às 6h30
      - agenda [meditação](tipo_atividade) para hoje às 21h
      - me lembra de [meditar](tipo_atividade) amanhã às 6h
      - me lembre de [correr](tipo_atividade) sábado de manhã
      - vou [correr](tipo_atividade) amanhã às 7h
      - vou [nadar](tipo_atividade) na quinta às 8h
      - amanhã vou [pedalar](tipo_atividade) às 6h
      - quero marcar [yoga](tipo_atividade) depois de amanhã
      - agendar [alongamento](tipo_atividade) para hoje à noite
      - programar [corrida](tipo_atividade) para domingo às 7h
      - planejo [caminhar](tipo_atividade) amanhã às 18h
      - agendar [leitura](tipo_atividade) para hoje às 22h
      - marcar [ciclismo](tipo_atividade) para sábado às 8h
      - agendar uma [corrida](tipo_atividade) para terça às 7h
      - preciso agendar [natação](tipo_atividade) na quarta às 19h
      - agende [yoga](tipo_atividade) para amanhã às 7 da manhã
      - reservar horário para [corrida](tipo_atividade) amanhã
      - lembrete de [caminhada](tipo_atividade) amanhã às 17h
      - marcar [exercício](tipo_atividade) para dia 20 às 18h
      - vou fazer [yoga](tipo_atividade) amanhã cedo
      - vou [meditar](tipo_atividade) hoje às 22h
      - pretendo [correr](tipo_atividade) na sexta às 6h
      - quero agendar uma atividade
      - agendar atividade
      - marcar um compromisso de treino para amanhã
      - quero marcar uma atividade para depois

