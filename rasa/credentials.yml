# 🎓 CREDENTIALS - INTEGRAÇÕES COM CANAIS
# =========================================
# Configuração para conectar Rasa com diferentes plataformas:
# - REST API (para apps customizados)
# - Socket.IO (para web real-time)
# - Facebook Messenger
# - Slack, Telegram, etc.

# 🌐 REST API
# -----------
# API HTTP simples para integrar com qualquer sistema
rest:
  # 🎓 Endpoint: POST http://localhost:5005/webhooks/rest/webhook

# 🔌 SOCKET.IO
# ------------
# WebSocket para comunicação em tempo real (nossa interface Flask usa!)
socketio:
  user_message_evt: user_uttered
  bot_message_evt: bot_uttered
  session_persistence: true
  # 🎓 Permite chat real-time na interface web!

# 📱 FACEBOOK MESSENGER (Opcional - Comentado)
# ---------------------------------------------
# facebook:
#   verify: "rasa-bot"
#   secret: "seu_app_secret"
#   page-access-token: "seu_page_token"

# 💬 SLACK (Opcional - Comentado)
# --------------------------------
# slack:
#   slack_token: "xoxb-seu-token"
#   slack_channel: "#rasa"

# 🤖 TELEGRAM (Opcional - Comentado)
# -----------------------------------
# telegram:
#   access_token: "seu_bot_token"
#   verify: "seu_bot_name"
#   webhook_url: "https://seu-dominio.com/webhooks/telegram/webhook"

# 🎓 NOTA DIDÁTICA:
# 
# COMO ADICIONAR NOVOS CANAIS:
# 1. Descomente a seção do canal desejado
# 2. Adicione suas credenciais (tokens, secrets)
# 3. Reinicie o Rasa: rasa run
# 4. Configure webhook na plataforma
# 
# PARA ESTE PROJETO:
# - Usamos REST API para testes básicos
# - Usamos SocketIO para interface Flask (chat real-time)
# 
# EXERCÍCIO PARA ALUNOS:
# Adicionar canal Telegram:
# 1. Criar bot via BotFather
# 2. Obter token
# 3. Configurar aqui
# 4. Testar conversas via Telegram!
