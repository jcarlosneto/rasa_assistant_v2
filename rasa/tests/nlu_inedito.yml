# FRASES INEDITAS PARA O NLU (rasa test nlu)
# ==========================================
# Nenhuma destas frases esta em data/nlu.yml. E a "prova" do modelo:
# medir em frase ja vista no treino e conferir a cola, nao o aprendizado.
# O script tests/checar_ineditas.py confirma que nao ha repeticao.

version: "3.1"

nlu:
  - intent: greet
    examples: |
      - olá, tudo certo?
      - opa, beleza?
  - intent: greet_morning
    examples: |
      - bom dia, tudo bem?
  - intent: goodbye
    examples: |
      - tchau, até amanhã
      - valeu, fui
  - intent: stop
    examples: |
      - cancela isso
      - quero parar
  - intent: registrar_atividade_rapido
    examples: |
      - tomei um copo de [água](tipo_atividade)
      - [corri](tipo_atividade) [5](duracao) minutos
      - fiz [yoga](tipo_atividade) [45](duracao) minutos
      - [caminhei](tipo_atividade) [20](duracao) minutos
      - [malhei](tipo_atividade) [1](duracao) hora
      - [nadei](tipo_atividade) meia hora
      - [meditei](tipo_atividade) agora há pouco
      - [pedalei](tipo_atividade) [40](duracao) minutos [leve](intensidade)
      - fiz [alongamento](tipo_atividade) de [10](duracao) minutos
      - [corri](tipo_atividade) [30](duracao) minutos [intenso](intensidade)
  - intent: registrar_atividade_detalhado
    examples: |
      - quero registrar exercício
      - fazer um registro detalhado agora
  - intent: agendar_atividade
    examples: |
      - agendar [corrida](tipo_atividade) para quinta às 6h
      - marcar [yoga](tipo_atividade) amanhã às 8h
      - vou [caminhar](tipo_atividade) amanhã às 7h
      - me lembra de [nadar](tipo_atividade) sexta às 19h
      - quero agendar [meditação](tipo_atividade) para hoje às 23h
  - intent: ask_agenda
    examples: |
      - qual é a minha agenda?
      - o que eu tenho agendado para amanhã?
      - mostra meus agendamentos
  - intent: ask_progresso_hoje
    examples: |
      - como estou indo hoje?
      - o que já fiz hoje?
  - intent: ask_progresso_semana
    examples: |
      - como foi a minha semana?
      - resumo semanal
  - intent: ask_motivacao
    examples: |
      - preciso de um incentivo
      - me dá uma motivação
  - intent: bot_challenge
    examples: |
      - você é um robô?
      - estou falando com uma pessoa?
  - intent: ask_ajuda
    examples: |
      - o que você sabe fazer?
      - preciso de ajuda aqui
  - intent: out_of_scope
    examples: |
      - qual a capital da França?
      - me conta uma piada boa
      - quanto está o dólar?
